<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Perangkat - IoT Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading">Monitoring IoT Based</div>
            <div class="list-group list-group-flush">
                <a href="index.html" class="list-group-item list-group-item-action">
                    <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                </a>
                <a href="sensor-history.html" class="list-group-item list-group-item-action">
                    <i class="fas fa-thermometer-half me-2"></i> Data Sensor
                </a>
                <a href="actuator-history.html" class="list-group-item list-group-item-action">
                    <i class="fas fa-cogs me-2"></i> Data Aktuator
                </a>
                <a href="devices.html" class="list-group-item list-group-item-action active">
                    <i class="fas fa-microchip me-2"></i> Perangkat (Dummy)
                </a>
                <a href="users.html" class="list-group-item list-group-item-action" id="menu-pengguna">
                    <i class="fas fa-users me-2"></i> Pengguna
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <!-- Top Navigation -->
            <nav class="navbar navbar-expand-lg navbar-light top-navbar py-3 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-bars fs-4 me-3" id="menu-toggle" style="cursor: pointer;"></i>
                    <h4 class="m-0 fw-bold">Perangkat Terdaftar</h4>
                </div>
                <div class="ms-auto d-flex align-items-center">
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle fw-bold" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle fs-5 me-1"></i> <span id="username-display">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item text-danger" href="#" id="btn-logout"><i
                                        class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid p-4">
                <div class="card card-custom">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold m-0"><i class="fas fa-microchip text-primary me-2"></i>Daftar Mikrokontroler
                        </h5>
                        <button class="btn btn-primary rounded-3 fw-bold shadow-sm" onclick="openAddDeviceModal()"><i
                                class="fas fa-plus me-1"></i> Add New Device</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>Nama Perangkat</th>
                                        <th>Tipe Board</th>
                                        <th>Serial Number</th>
                                        <th>Alamat IP</th>
                                        <th>Lokasi Ruangan</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="devices-tbody">
                                    <!-- Dummy data akan dimuat oleh JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Add Device -->
    <div class="modal fade" id="deviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold">Tambah Perangkat Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="deviceForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Nama Perangkat</label>
                            <input type="text" class="form-control bg-light border-0 shadow-sm rounded-3" id="devName"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Tipe Board</label>
                            <input type="text" class="form-control bg-light border-0 shadow-sm rounded-3" id="devType"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Serial Number</label>
                            <input type="text" class="form-control bg-light border-0 shadow-sm rounded-3" id="devSN"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Alamat IP</label>
                            <input type="text" class="form-control bg-light border-0 shadow-sm rounded-3" id="devIP"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Lokasi Ruangan</label>
                            <input type="text" class="form-control bg-light border-0 shadow-sm rounded-3" id="devRoom"
                                required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-light shadow-sm rounded-3 fw-bold text-secondary"
                        data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary shadow-sm rounded-3 fw-bold"
                        onclick="addDummyDevice()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <!-- App Logic -->
    <script src="js/app.js"></script>
    <script>
        checkAuth();

        document.getElementById("menu-toggle").addEventListener("click", function (e) {
            e.preventDefault();
            document.getElementById("wrapper").classList.toggle("toggled");
            var sidebar = document.getElementById("sidebar-wrapper");
            if (sidebar.style.marginLeft === "-250px") sidebar.style.marginLeft = "0";
            else sidebar.style.marginLeft = "-250px";
        });

        // Dummy Devices Data
        var devices = [
            { name: 'ESP32 Main Controller', type: 'NodeMCU ESP32', sn: 'SN-ESP32-001', ip: '192.168.1.101', room: 'Ruang Tamu', status: 'Offline' },
            { name: 'Arduino Sensor Node', type: 'Arduino Uno R3', sn: 'SN-ARD-002', ip: '192.168.1.102', room: 'Kamar Tidur', status: 'Offline' },
            { name: 'ESP8266 Kitchen Node', type: 'Wemos D1 Mini', sn: 'SN-ESP82-003', ip: '192.168.1.103', room: 'Dapur', status: 'Offline' },
            { name: 'Raspberry Pi Gateway', type: 'Raspberry Pi 4', sn: 'SN-RPI-004', ip: '192.168.1.104', room: 'Teras Depan', status: 'Offline' }
        ];
        
        var deviceLastSeen = {};
        var deviceTimeoutMs = 5000;

        function renderDevices() {
            var tbody = document.getElementById('devices-tbody');
            tbody.innerHTML = '';
            devices.forEach((dev, index) => {
                var badgeClass = dev.status === 'Online' ? 'bg-success' : 'bg-danger';
                tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td class="fw-bold">${dev.name}</td>
                    <td>${dev.type}</td>
                    <td>${dev.sn}</td>
                    <td>${dev.ip}</td>
                    <td>${dev.room}</td>
                    <td><span class="badge ${badgeClass}">${dev.status}</span></td>
                </tr>
            `;
            });
        }

        var devModal;
        document.addEventListener('DOMContentLoaded', () => {
            devModal = new bootstrap.Modal(document.getElementById('deviceModal'));
            renderDevices();
        });

        function openAddDeviceModal() {
            document.getElementById('deviceForm').reset();
            devModal.show();
        }

        function addDummyDevice() {
            var name = document.getElementById('devName').value;
            var type = document.getElementById('devType').value;
            var sn = document.getElementById('devSN').value;
            var ip = document.getElementById('devIP').value;
            var room = document.getElementById('devRoom').value;

            if (!name || !type || !sn || !ip || !room) {
                alert('Semua data wajib diisi!');
                return;
            }

            devices.push({
                name, type, sn, ip, room, status: 'Offline' // Default dummy status
            });

            renderDevices();
            devModal.hide();
        }


        // === MQTT LOGIC ===
        var MQTT_HOST = 'broker.emqx.io';
        var MQTT_PORT = 8083;
        var clientID = "WebClient_Dev_" + parseInt(Math.random() * 1000, 10);
        var mqttClient = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, "/mqtt", clientID);

        mqttClient.onMessageArrived = (msg) => {
            if (msg.destinationName === 'tugasiot/sensor') {
                var data = JSON.parse(msg.payloadString);
                var sn = data.sn || 'SN-ESP32-001';
                deviceLastSeen[sn] = Date.now();
                
                var statusChanged = false;
                devices.forEach(dev => {
                    if (dev.sn === sn && dev.status !== 'Online') {
                        dev.status = 'Online';
                        statusChanged = true;
                    }
                });
                if (statusChanged) renderDevices();
            }
        };

        mqttClient.connect({
            onSuccess: () => {
                console.log("MQTT Terhubung di Menu Perangkat");
                mqttClient.subscribe('tugasiot/sensor');
            }
        });

        setInterval(() => {
            var now = Date.now();
            var changed = false;
            devices.forEach(dev => {
                var lastSeen = deviceLastSeen[dev.sn] || 0;
                var isDevOnline = (now - lastSeen <= deviceTimeoutMs) && lastSeen > 0;
                var newStatus = isDevOnline ? 'Online' : 'Offline';
                if (dev.status !== newStatus) {
                    dev.status = newStatus;
                    changed = true;
                }
            });
            if (changed) renderDevices();
        }, 1000);
    </script>

</body>

</html>
